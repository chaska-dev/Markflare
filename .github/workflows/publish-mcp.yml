name: Publish MCP package

# Release flow: bump version in mcp/package.json, commit, then
#   git tag mcp-v1.2.3 && git push origin mcp-v1.2.3
# Publishes to npm via trusted publishing (OIDC) — no npm token needed.

on:
  push:
    tags:
      - 'mcp-v*'

permissions:
  id-token: write # required for npm trusted publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#mcp-v}"
          VERSION=$(node -p "require('./mcp/package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag mcp-v$TAG does not match mcp/package.json version $VERSION"
            exit 1
          fi

      - name: Install and build
        working-directory: mcp
        run: |
          npm install --no-fund --no-audit
          npm run build

      - name: Smoke test (stdio handshake)
        working-directory: mcp
        run: |
          (printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0.0.0"}}}'; sleep 0.5) \
            | node dist/index.js | grep -q '"parasti-mcp"'

      - name: Debug OIDC identity
        run: |
          echo "node: $(node --version), npm: $(npm --version)"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NODE_AUTH_TOKEN is set (length: ${#NODE_AUTH_TOKEN})"
          else
            echo "NODE_AUTH_TOKEN is unset"
          fi
          RAW=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
          echo "$RAW" | jq -r '.value // empty' | cut -d. -f2 | \
            python3 -c "import sys,base64,json;s=sys.stdin.read().strip();s+='='*(-len(s)%4);print(json.dumps(json.loads(base64.urlsafe_b64decode(s)),indent=2))"
          if [ -z "$(echo "$RAW" | jq -r '.value // empty')" ]; then
            echo "OIDC fetch raw response: $RAW" | head -c 300
          fi

      - name: Publish to npm
        working-directory: mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # TEMPORARY workaround for npm/cli#9969: the registry rejects
          # immutable-subject OIDC tokens ("package not found" -> E404), so we
          # suppress the OIDC path and publish with a granular token instead.
          # When npm fixes #9969, remove this env block (and the NPM_TOKEN
          # secret) to switch back to trusted publishing, then recreate the
          # trusted publisher connection on npmjs.com (it expires after 2
          # days without a successful publish).
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        run: npm publish
