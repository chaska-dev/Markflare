<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Parasti">
  <!--
    Parasti logo-mark — "stele = note", geometry traced from the approved
    mockup (mockup-chisel-nick.png), measured pixel-by-pixel:
      - body aspect 0.64 (wider than v1), corner radius ~19% of width
      - bottom-right: a V-notch cut into the right side, with a thin
        wedge "tail" hanging down beside it (tip at ~88% of body height)
    Adaptive: uses currentColor, so it follows text color in light/dark themes.
    Drop-in replacement for Parasti's public/logo-mark.svg (favicon).
  -->
  <defs>
    <mask id="engraved">
      <rect width="64" height="64" fill="#fff"/>
      <g stroke="#000" stroke-linecap="round" fill="none">
        <!-- title line (thicker, long) -->
        <path d="M19.5 21H43.5" stroke-width="5"/>
        <!-- body lines (staggered, left-aligned) -->
        <path d="M19.5 28.5H35.5" stroke-width="4"/>
        <path d="M19.5 35H43.5" stroke-width="4"/>
        <path d="M19.5 41.5H28.5" stroke-width="4"/>
      </g>
    </mask>
  </defs>
  <path d="M19.6 1H44.4A7.4 7.4 0 0 1 51.9 8.4V50.3Q51.9 52.2 49.9 52.9L48 55.4L42.2 52.9L43.1 55.6L46.2 62.5H19.9A7.8 7.8 0 0 1 12.1 54.7V8.4A7.4 7.4 0 0 1 19.6 1Z"
        fill="currentColor" mask="url(#engraved)"/>
</svg>
